name: Criteria extension

on:
  workflow_dispatch:

concurrency:
  group: criteria-extension
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign on AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node dist/index.js criteria-extension --sign

      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" ~/.assist/criteria-extension/criteria-extension.xpi --clobber

      - name: Commit update manifest
        run: |
          cp ~/.assist/criteria-extension/updates.json criteria-extension/updates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add criteria-extension/updates.json
          git commit -m "chore: criteria extension ${{ steps.version.outputs.version }} update manifest [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
