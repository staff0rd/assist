name: iOS TestFlight

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (defaults to the latest v* release)
        required: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::Not a v* release tag: '$tag'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        if: github.event_name == 'schedule'
        run: npm ci

      - name: Check for iOS changes since the last TestFlight upload
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx tsx src/commands/sessions/web/ios/iosChanged.ts | tee "$RUNNER_TEMP/ios-changed.txt"
          if grep -q '^changed=false$' "$GITHUB_OUTPUT"; then
            {
              echo "### Skipped TestFlight upload: ${TAG#v}"
              cat "$RUNNER_TEMP/ios-changed.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  testflight:
    name: TestFlight ${{ needs.gate.outputs.tag }}
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: macos-15
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios-app/ios

      - name: Install dependencies
        run: |
          npm ci
          npm run ios:install

      - name: Build web app and sync to iOS
        run: npm run ios:build

      - name: Write App Store Connect API key
        run: echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Build and upload to TestFlight
        working-directory: ios-app/ios
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ needs.gate.outputs.tag }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Summarize uploaded build
        run: |
          echo "### Uploaded to TestFlight: ${VERSION#v} ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
