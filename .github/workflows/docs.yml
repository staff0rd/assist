name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix docs

      - name: Build
        env:
          DOCS_BASE_PATH: /assist
          DOCS_GOATCOUNTER_CODE: ${{ vars.DOCS_GOATCOUNTER_CODE }}
        run: |
          npm run docs:build
          mkdir site
          mv docs/dist site/assist
          cp docs/_redirects site/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_DOCS_SITE_ID }}
        run: npx netlify-cli deploy --no-build --dir=site --prod --message "Deployed commit ${{ github.sha }}"
