name: Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (defaults to the version on main)
        required: false
      only-if-changed:
        description: Skip unless the extension changed since the last signed version
        type: boolean
        default: false

concurrency:
  group: extension
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Check whether the built extension differs from the last signed version
        id: changes
        if: inputs.only-if-changed
        run: npx tsx src/commands/extension/extensionChanged.ts

      - name: Sign on AMO
        if: steps.changes.outputs.changed != 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node dist/index.js extension --sign

      - name: Attach to release
        if: steps.changes.outputs.changed != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" ~/.assist/extension/assist-extension.xpi --clobber

      - name: Commit update manifest
        if: steps.changes.outputs.changed != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx tsx src/commands/extension/publishUpdateManifest.ts

      - name: Re-run release for commits a busy release run skipped as behind main
        if: steps.changes.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main
