<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				font:
					14px/20px -apple-system,
					BlinkMacSystemFont,
					sans-serif;
				margin: 16px;
			}
			label {
				display: block;
				margin-bottom: 4px;
				font-weight: 600;
			}
			input {
				width: 320px;
				padding: 4px 6px;
			}
		</style>
	</head>
	<body>
		<form>
			<label for="serverUrl">assist web server URL</label>
			<input id="serverUrl" name="serverUrl" type="url" required />
			<button type="submit">Save</button>
			<span data-status role="status"></span>
		</form>
		<section>
			<h2>Approved scripts</h2>
			<p>
				<code>assist browser run</code> shows each script on the page and runs
				it only when you click Run. Running needs the userScripts permission.
			</p>
			<button type="button" data-grant-scripts>Allow scripts</button>
			<span data-scripts-status role="status"></span>
		</section>
		<script src="options.js"></script>
	</body>
</html>
