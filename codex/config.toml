# Managed by `assist sync`: merged into ~/.codex/config.toml when the codex CLI
# is detected. Registers the assist codex-hook, which auto-approves read-only
# commands, injects the repo's composed advice at SessionStart, and reports
# running/waiting status for daemon-tracked sessions.
# `assist sync` also records Codex trust for exactly these handlers, so Codex
# does not stop for hook review; any other hook still needs normal review.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "assist codex-hook"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "assist codex-hook"

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = "assist codex-hook"

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "assist codex-hook"

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "assist codex-hook"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "assist codex-hook"
