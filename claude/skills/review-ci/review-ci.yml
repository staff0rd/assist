name: Review CI

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.user.type != 'Bot' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    environment: ${{ vars.REVIEW_CI_ENVIRONMENT }}
    env:
      REVIEW_CI_PROVIDER: ${{ vars.REVIEW_CI_PROVIDER }}
      REVIEW_CI_BASE_URL: ${{ vars.REVIEW_CI_BASE_URL }}
      REVIEW_CI_REVIEWER_1: ${{ vars.REVIEW_CI_REVIEWER_1 }}
      REVIEW_CI_REVIEWER_2: ${{ vars.REVIEW_CI_REVIEWER_2 }}
      REVIEW_CI_SYNTHESIS: ${{ vars.REVIEW_CI_SYNTHESIS }}
      REVIEW_CI_AZURE_CLIENT_ID: ${{ vars.REVIEW_CI_AZURE_CLIENT_ID }}
      REVIEW_CI_AZURE_TENANT_ID: ${{ vars.REVIEW_CI_AZURE_TENANT_ID }}
      REVIEW_CI_API_KEY: ${{ secrets.REVIEW_CI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Claude Code
        if: startsWith(vars.REVIEW_CI_REVIEWER_1, 'claude:') || startsWith(vars.REVIEW_CI_REVIEWER_2, 'claude:') || startsWith(vars.REVIEW_CI_SYNTHESIS, 'claude:')
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex
        if: startsWith(vars.REVIEW_CI_REVIEWER_1, 'codex:') || startsWith(vars.REVIEW_CI_REVIEWER_2, 'codex:') || startsWith(vars.REVIEW_CI_SYNTHESIS, 'codex:')
        run: npm install -g @openai/codex

      - name: Allow unprivileged user namespaces for the Codex sandbox
        if: startsWith(vars.REVIEW_CI_REVIEWER_1, 'codex:') || startsWith(vars.REVIEW_CI_REVIEWER_2, 'codex:') || startsWith(vars.REVIEW_CI_SYNTHESIS, 'codex:')
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check review config
        run: node .github/review-ci/check.mjs

      - name: Review PR
        run: node .github/review-ci/review.mjs
